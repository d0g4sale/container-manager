<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Friendly, non-Docker gradient: fresh aqua -> deep indigo, diagonal for depth -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#33D6C0"/>
      <stop offset="0.5" stop-color="#2C8FE6"/>
      <stop offset="1"   stop-color="#5B2EC4"/>
    </linearGradient>
    <!-- Soft top highlight to give the squircle dimensionality -->
    <linearGradient id="sheen" x1="512" y1="64" x2="512" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glyphshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0A1A4A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- App squircle -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>

  <!-- Shipping container, 3/4 view -->
  <g filter="url(#glyphshadow)" transform="translate(2,14)">

    <!-- ===== Fills ===== -->
    <!-- Top face -->
    <polygon points="250,440 370,380 770,340 650,400" fill="#FFFFFF"/>
    <!-- Long side face -->
    <polygon points="250,660 650,620 650,400 250,440" fill="#E2ECF6"/>
    <!-- Side top & bottom rails -->
    <polygon points="250,440 650,400 650,424 250,464" fill="#2C8FE6"/>
    <polygon points="250,636 650,596 650,620 250,660" fill="#2C8FE6"/>
    <!-- Side corrugation ribs (inset between the rails, evenly spaced) -->
    <g stroke="#A6BFD9" stroke-width="12" stroke-linecap="round">
      <line x1="280" y1="461" x2="280" y2="633"/>
      <line x1="322" y1="457" x2="322" y2="629"/>
      <line x1="364" y1="453" x2="364" y2="625"/>
      <line x1="406" y1="448" x2="406" y2="620"/>
      <line x1="448" y1="444" x2="448" y2="616"/>
      <line x1="490" y1="440" x2="490" y2="612"/>
      <line x1="532" y1="436" x2="532" y2="608"/>
      <line x1="574" y1="432" x2="574" y2="604"/>
      <line x1="616" y1="427" x2="616" y2="599"/>
    </g>

    <!-- Door end face -->
    <polygon points="650,620 770,560 770,340 650,400" fill="#2F7DC4"/>
    <!-- Door top & bottom rails -->
    <polygon points="650,400 770,340 770,362 650,422" fill="#1F5FA0"/>
    <polygon points="650,598 770,538 770,560 650,620" fill="#1F5FA0"/>
    <!-- Door center seam + a locking bar per door -->
    <g stroke="#16487E" stroke-width="7" stroke-linecap="round">
      <line x1="686" y1="404" x2="686" y2="580"/>
      <line x1="710" y1="392" x2="710" y2="568"/>
      <line x1="734" y1="380" x2="734" y2="556"/>
    </g>

    <!-- ===== Crisp outlines, drawn last so nothing overlaps them ===== -->
    <g fill="none" stroke="#16487E" stroke-width="8" stroke-linejoin="round">
      <polygon points="250,440 370,380 770,340 650,400"/>
      <polygon points="250,660 650,620 650,400 250,440"/>
      <polygon points="650,620 770,560 770,340 650,400"/>
    </g>
  </g>
</svg>
