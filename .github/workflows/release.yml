name: Build, Sign & Notarize

on:
  push:
    branches: ["main"]    # CI build on every commit to main
    tags: ["v*"]          # full sign+notarize release: `git tag v1.0 && git push --tags`
  workflow_dispatch: {}   # or run manually from the Actions tab

# Shared across jobs.
env:
  PROJECT: Container Manager.xcodeproj
  SCHEME: Container Manager
  APP_NAME: Container Manager
  TEAM_ID: MKTMGKS2F9

jobs:
  # --- Fast, unsigned compile + unit tests for main / manual runs (no secrets needed) ---
  ci-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Use the newest stable Xcode the runner image ships. This auto-tracks
      # runner updates instead of pinning a version that may not be installed.
      # The project's deployment target must be <= the SDK this Xcode provides.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      # The .xcodeproj is not committed — it's generated by XcodeGen from
      # project.yml (see README). Regenerate it before any xcodebuild step.
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Build and run the unit tests without code signing — verifies main
      # compiles and the test suite passes, no certs/notary needed. Scoped to
      # the unit-test bundle (the UI-test bundle relaunches the app repeatedly,
      # which is slow and flaky on headless CI).
      - name: Build & test
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:"Container ManagerTests" \
            CODE_SIGNING_ALLOWED=NO

  # --- Full Developer ID sign + notarize + release, tags only ---
  # Delegates to the reusable pipeline so the signing steps live in one place.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write     # caller must grant what the reusable workflow requests
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
