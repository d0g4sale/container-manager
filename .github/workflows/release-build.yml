name: Release build (reusable)

# Reusable signed-release pipeline. Called by release.yml (on tags) and
# auto-release.yml (manual, computed version). Checks out the given tag,
# archives with Developer ID signing, notarizes, and attaches the DMG to a
# GitHub Release for that tag.
on:
  workflow_call:
    inputs:
      version:
        description: "Tag to build and release, e.g. v1.2.3"
        required: true
        type: string

env:
  PROJECT: Container Manager.xcodeproj
  SCHEME: Container Manager
  APP_NAME: Container Manager
  # Filename slug for the packaged DMG and release asset (no spaces, URL-friendly).
  DMG_NAME: Container-Manager
  TEAM_ID: MKTMGKS2F9

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write     # needed to attach the .dmg to a GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      # Use the newest stable Xcode the runner image ships. This auto-tracks
      # runner updates instead of pinning a version that may not be installed.
      # The project's deployment target must be <= the SDK this Xcode provides.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      # Derive the marketing version from the tag (leading "v" stripped, e.g.
      # "v1.2.3" -> "1.2.3") and the versioned DMG filename. Both are exposed to
      # later steps via $GITHUB_ENV. APP_VERSION is baked into the app so the
      # About panel shows the real release version instead of project.yml's
      # placeholder.
      - name: Compute version and DMG filename
        run: |
          echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          echo "DMG_FILE=${DMG_NAME}-${VERSION#v}" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ inputs.version }}

      # The .xcodeproj is not committed — it's generated by XcodeGen from
      # project.yml (see README). Regenerate it before any xcodebuild step.
      - name: Generate Xcode project
        run: |
          # The runner image pre-taps aws/tap, which newer Homebrew flags as
          # untrusted and warns about on every invocation. We don't use it —
          # untap it (tolerating its absence on future images) to keep logs clean.
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
          xcodegen generate

      # --- Gate the release on the unit tests: don't sign/notarize a bad build ---
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:"Container ManagerTests" \
            CODE_SIGNING_ALLOWED=NO

      # --- Import the Developer ID signing certificate into a throwaway keychain ---
      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Make the keychain visible to the build tools.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      # --- Archive with Developer ID signing ---
      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      # --- Export the signed .app (Developer ID distribution) ---
      - name: Export .app
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # --- Package a .dmg, notarize it, and staple the ticket ---
      - name: Create DMG
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          # The exported bundle is named after the app's PRODUCT_NAME (e.g.
          # "Container Manager.app"), which differs from the URL-friendly
          # $DMG_NAME. Discover it so a product rename never breaks packaging.
          APP_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in $RUNNER_TEMP/export" >&2
            ls -la "$RUNNER_TEMP/export" >&2 || true
            exit 1
          fi
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Container Manager" \
            -srcfolder "$STAGE" -ov -format UDZO \
            "$RUNNER_TEMP/$DMG_FILE.dmg"

      - name: Notarize & staple
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit "$RUNNER_TEMP/$DMG_FILE.dmg" \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          # Staple the ticket so it verifies offline.
          xcrun stapler staple "$RUNNER_TEMP/$DMG_FILE.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DMG_FILE }}-dmg
          path: ${{ runner.temp }}/${{ env.DMG_FILE }}.dmg

      # Attach the DMG to the GitHub Release for this tag (creates it if needed).
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          files: ${{ runner.temp }}/${{ env.DMG_FILE }}.dmg
